<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <rect width="300" height="300" fill="#0a0a0a"/>
  <!-- TV antenna left -->
  <line x1="130" y1="68" x2="105" y2="40" stroke="#f5c518" stroke-width="7" stroke-linecap="round"/>
  <!-- TV antenna right -->
  <line x1="170" y1="68" x2="195" y2="40" stroke="#f5c518" stroke-width="7" stroke-linecap="round"/>
  <!-- TV frame outer (gold/yellow) -->
  <rect x="72" y="68" width="156" height="110" rx="18" fill="#f5c518"/>
  <!-- TV screen inner (black) -->
  <rect x="86" y="82" width="128" height="82" rx="12" fill="#0a0a0a"/>
  <!-- "extra" text inside TV screen -->
  <text x="150" y="137" font-family="'Arial Black', Impact, sans-serif" font-size="34" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="-1">extra</text>
  <!-- "saga" text below TV -->
  <text x="150" y="228" font-family="'Arial Black', Impact, sans-serif" font-size="62" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="-2">saga</text>
</svg>
