<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <rect width="300" height="300" fill="#0a0a0a"/>
  <!-- Outer circle border -->
  <circle cx="150" cy="138" r="118" fill="none" stroke="#f0e8d4" stroke-width="3"/>
  <!-- Chef body (simple silhouette) -->
  <ellipse cx="150" cy="108" rx="42" ry="44" fill="#6B4226"/>
  <!-- Head -->
  <circle cx="150" cy="82" r="32" fill="#8B6040"/>
  <!-- Hair suggestion (bald) -->
  <!-- Face features -->
  <ellipse cx="140" cy="80" rx="4" ry="5" fill="#2a1a0a"/>
  <ellipse cx="162" cy="80" rx="4" ry="5" fill="#2a1a0a"/>
  <!-- Mustache -->
  <path d="M138 92 Q150 100 162 92" stroke="#2a1a0a" stroke-width="3" fill="#2a1a0a" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M140 96 Q150 106 162 96" stroke="#2a1a0a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- White shirt / dhoti -->
  <rect x="110" y="148" width="80" height="40" rx="6" fill="#f5f0e8"/>
  <!-- Towel stripe details -->
  <line x1="175" y1="148" x2="175" y2="188" stroke="#b0a090" stroke-width="2"/>
  <line x1="185" y1="148" x2="185" y2="188" stroke="#b0a090" stroke-width="2"/>
  <!-- Thumbs up hand (right) -->
  <ellipse cx="195" cy="140" rx="15" ry="20" fill="#8B6040" transform="rotate(-15, 195, 140)"/>
  <!-- Plate with food (left arm) -->
  <ellipse cx="108" cy="128" rx="28" ry="8" fill="#e0d0b0"/>
  <!-- Samosa shapes on plate -->
  <path d="M96 124 L108 108 L120 124 Z" fill="#d4a030"/>
  <circle cx="100" cy="120" r="5" fill="#c09040"/>
  <circle cx="116" cy="120" r="5" fill="#c09040"/>
  <!-- Decorative stars/dots -->
  <text x="62" y="218" font-family="Georgia, serif" font-size="14" fill="#f0e8d4">✦</text>
  <text x="228" y="218" font-family="Georgia, serif" font-size="14" fill="#f0e8d4">✦</text>
  <!-- SNACKS text -->
  <text x="150" y="232" font-family="'Arial Black', 'Impact', sans-serif" font-size="34" font-weight="900" text-anchor="middle" fill="#f0e8d4" letter-spacing="2">SNACKS</text>
  <!-- PANDITHA text -->
  <text x="150" y="265" font-family="'Arial Black', 'Impact', sans-serif" font-size="26" font-weight="900" text-anchor="middle" fill="#f0e8d4" letter-spacing="3">PANDITHA</text>
  <!-- Dots separator -->
  <text x="150" y="278" font-family="Georgia, serif" font-size="10" text-anchor="middle" fill="#f0e8d4">· · ·</text>
</svg>
