<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <rect width="300" height="300" fill="#0a0a0a"/>
  <!-- Clapperboard body -->
  <rect x="45" y="90" width="210" height="160" rx="12" fill="#1a1a1a"/>
  <!-- Clapperboard top (slate board) -->
  <rect x="45" y="62" width="210" height="44" rx="8" fill="#1a1a1a"/>
  <!-- Stripes on top bar -->
  <clipPath id="topClip">
    <rect x="45" y="62" width="210" height="44" rx="8"/>
  </clipPath>
  <g clip-path="url(#topClip)">
    <rect x="45" y="62" width="210" height="22" fill="#f0f0f0"/>
    <rect x="58"  y="62" width="18" height="22" fill="#1a1a1a"/>
    <rect x="94"  y="62" width="18" height="22" fill="#1a1a1a"/>
    <rect x="130" y="62" width="18" height="22" fill="#1a1a1a"/>
    <rect x="166" y="62" width="18" height="22" fill="#1a1a1a"/>
    <rect x="202" y="62" width="18" height="22" fill="#1a1a1a"/>
    <rect x="45" y="84" width="210" height="22" fill="#1a1a1a"/>
  </g>
  <!-- Hinge -->
  <circle cx="65" cy="74" r="8" fill="#555"/>
  <!-- "Buzzing" in red -->
  <text x="150" y="162" font-family="'Arial Black', Impact, sans-serif" font-size="48" font-weight="900" text-anchor="middle" fill="#cc1111" letter-spacing="-1">Buzzing</text>
  <!-- "Mafia" in white -->
  <text x="150" y="218" font-family="'Arial Rounded MT Bold', 'Arial Black', sans-serif" font-size="44" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="-1">mafia</text>
  <!-- Registered mark -->
  <text x="235" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#cc1111">®</text>
  <!-- Dividing line -->
  <line x1="65" y1="232" x2="235" y2="232" stroke="#444" stroke-width="1.5"/>
  <line x1="148" y1="232" x2="148" y2="250" stroke="#444" stroke-width="1.5"/>
  <line x1="108" y1="232" x2="108" y2="250" stroke="#444" stroke-width="1.5"/>
  <line x1="188" y1="232" x2="188" y2="250" stroke="#444" stroke-width="1.5"/>
</svg>
